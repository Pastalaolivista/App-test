// Retailer-native search URLs. {q} is replaced with the URL-encoded product name.
// Only retailers whose search-URL format is known go here; anything else falls
// back to a site-restricted Google search, which always resolves.
const BRAND_SEARCH_URLS = {
  "ASOS Design": "https://www.asos.com/search/?q={q}",
  "Topshop": "https://www.asos.com/search/?q={q}",

function productLink(item) {
  // 1. A real product-page URL, if one has been added to the item. This is the
  //    only way to link to a *specific* item with certainty.
  if (item.url) return item.url;

  // 2. A SKU / product code searched on the retailer's own site. Retailer search
  //    engines resolve their own codes to the exact product, so this usually
  //    lands on a single result.
  const template = BRAND_SEARCH_URLS[item.brand];
  if (item.sku && template) {
    return template.replace("{q}", encodeURIComponent(item.sku));
  }

  // 3. Jump straight to the product page.
  //
  //    DuckDuckGo's "lucky" bang (a leading backslash) skips the results page
  //    entirely and redirects to the top hit. Restricted to the brand's own
  //    domain and paired with a real, distinctive model name ("501 Original",
  //    "Wallabee", "XT-6"), the top hit IS the product page — so the user lands
  //    on the item itself rather than a list of results.
  const domain = BRAND_DOMAINS[item.brand];
  if (domain) {
    const lucky = `\\ site:${domain} ${item.product}`;
    return `https://duckduckgo.com/?q=${encodeURIComponent(lucky)}`;
  }

  // 4. No known domain — lucky-jump on brand + product across the whole web.
  const lucky = `\\ ${item.brand} ${item.product}`;
  return `https://duckduckgo.com/?q=${encodeURIComponent(lucky)}`;
}

// legible at 28px. Reads as a mark rather than an illustration.

          >
            <div style={{ display: "flex", background: "rgba(20,26,44,0.75)", color: "#F2EFE8" }}>
              <div style={{ flex: 1, padding: "18px 16px 16px 16px", display: "flex", alignItems: "flex-start", justifyContent: "space-between" }}>
                <div>
                  <div style={{ display: "flex", alignItems: "center", gap: 8, marginBottom: 4 }}>
                    <Tag size={13} color="#C9A876" />
                    <span style={{ fontFamily: mono, fontSize: 10, letterSpacing: "0.25em", color: "#C9A876" }}>
                      {selectedCategory.section === "women" ? "WOMEN'S" : selectedCategory.section === "men" ? "MEN'S" : "UNISEX"}
                    </span>
                  </div>
                  <h2 style={{ fontFamily: serif, fontSize: 26, margin: 0, fontWeight: 600, letterSpacing: "-0.01em" }}>{selectedCategory.name}</h2>
                  <p style={{ fontSize: 12, marginTop: 4, color: "#A8B2C6" }}>{currentOutfit.label}</p>
                </div>
                <button
                  onClick={() => setSelectedCategory(null)}
                  aria-label="Close"
                  style={{ padding: 6, borderRadius: 999, background: "rgba(247,245,241,0.1)", border: "none", cursor: "pointer", color: "#F7F5F1", flexShrink: 0 }}
                >
                  <X size={16} />
                </button>
              </div>
            </div>

            {/* outfit variant switcher */}
            <div
              style={{
                display: "flex",
                gap: 6,
                padding: "12px 16px 8px",
                overflowX: "auto",
                WebkitOverflowScrolling: "touch",
              }}
            >
              {selectedCategory.outfits.map((o, idx) => (
                <button
                  key={o.label}
                  onClick={() => setOutfitIndex(idx)}
                  style={{
                    flexShrink: 0,
                    whiteSpace: "nowrap",
                    padding: "8px 12px",
                    fontFamily: mono,
                    fontSize: 10,
                    letterSpacing: "0.05em",
                    textAlign: "center",
                    borderRadius: 3,
                    border: idx === outfitIndex ? "1px solid #C4785A" : "1px solid #302C28",
                    background: idx === outfitIndex ? "#C7303F" : "rgba(255,255,255,0.06)",
                    backdropFilter: "blur(10px)",
                    WebkitBackdropFilter: "blur(10px)",
                    color: idx === outfitIndex ? "#F7F5F1" : "#9A948A",
                    cursor: "pointer",
                  }}
                >
                  {o.label}
                </button>
              ))}
            </div>
            <p
              style={{
                fontFamily: mono,
                fontSize: 9,
                letterSpacing: "0.1em",
                textTransform: "uppercase",
                color: "#6E7C96",
                margin: "0 16px 4px",
              }}
            >
              {outfitIndex + 1} / {selectedCategory.outfits.length} · swipe for more
            </p>


            <div style={{ padding: "16px 24px 20px", overflowY: "auto" }}>
              <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", marginBottom: 12, gap: 8 }}>
                <p style={{ fontFamily: mono, fontSize: 10, letterSpacing: "0.2em", textTransform: "uppercase", color: "#6E7C96", margin: 0 }}>
                  Itemized
                </p>
              </div>
              <ul style={{ listStyle: "none", margin: 0, padding: 0 }}>
                {currentOutfit.items.map((item, idx) => {
                  const href = productLink(item);
                  return (
                  <li key={idx} style={{ borderTop: idx === 0 ? "none" : "1px solid #2A2724", padding: "12px 0" }}>
                    <a
                      href={href}
                      target="_blank"
                      rel="noopener noreferrer"
                      style={{
                        display: "flex",
                        alignItems: "center",
                        gap: 12,
                        textDecoration: "none",
                        color: "inherit",
                      }}
                    >
                      <div style={{ flex: 1, minWidth: 0 }}>
                        <p style={{ fontFamily: mono, fontSize: 10, letterSpacing: "0.15em", textTransform: "uppercase", color: "#FF6B78", margin: 0 }}>
                          {item.piece}
                        </p>
                        <p style={{ fontSize: 14, marginTop: 3, fontWeight: 500, letterSpacing: "0.005em", display: "flex", alignItems: "center", gap: 5 }}>
                          {item.product}
                          <ExternalLink size={11} color="#6E7C96" style={{ flexShrink: 0 }} />
                        </p>
                        <p style={{ fontSize: 12, color: "#8290A8", margin: 0, display: "flex", alignItems: "center", gap: 6, flexWrap: "wrap" }}>
                          {item.brand}
                          {item.popular && (
                            <span
                              style={{
                                display: "inline-flex",
                                alignItems: "center",
                                gap: 3,
                                fontFamily: mono,
                                fontSize: 9,
                                letterSpacing: "0.08em",
                                textTransform: "uppercase",
                                color: "#FF8A94",
                                background: "rgba(199,48,63,0.18)",
                                border: "1px solid rgba(226,73,90,0.42)",
                                backdropFilter: "blur(8px)",
                                WebkitBackdropFilter: "blur(8px)",
                                borderRadius: 3,
                                padding: "1px 5px",
                              }}
                            >
                              <Flame size={9} color="#FF8A94" />
                              Popular
                            </span>
                          )}
                        </p>
                      </div>
                      <p style={{ fontFamily: mono, fontSize: 13, whiteSpace: "nowrap", margin: 0, flexShrink: 0, fontVariantNumeric: "tabular-nums", color: "#FFFFFF" }}>
                        {`£${item.price}`}
                      </p>
                    </a>

                  </li>
                  );
                })}
              </ul>
            </div>

            <div style={{ padding: "16px 24px", display: "flex", alignItems: "center", justifyContent: "space-between", borderTop: "1px solid #2A2724", background: "rgba(255,255,255,0.045)" }}>
              <span style={{ fontFamily: mono, fontSize: 12, letterSpacing: "0.15em", textTransform: "uppercase", color: "#A8B2C6" }}>Total</span>
              <span style={{ fontFamily: serif, fontSize: 21, color: "#5B9DFF", fontWeight: 600, letterSpacing: "-0.01em" }}>£{total}</span>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}


ReactDOM.createRoot(document.getElementById("root")).render(<OutfitLookbook />);
</script>
</body>
</html>
